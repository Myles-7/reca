name: M0 quality and security gates

on:
  pull_request:
  push:
    branches: [main, codex/m0-continuous]

permissions:
  contents: read

concurrency:
  group: m0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.9.26"
      - run: bash scripts/ci/backend-quality.sh

  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.22"
      - run: bash scripts/ci/frontend-quality.sh

  migration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: reca_ci
          POSTGRES_USER: reca
          POSTGRES_PASSWORD: reca_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reca -d reca_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.9.26"
      - run: uv sync --frozen --all-groups
      - run: PGPASSWORD=reca_ci_password psql -h localhost -U reca -d reca_ci -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: DATABASE_URL=postgresql+psycopg://reca:reca_ci_password@localhost:5432/reca_ci bash scripts/ci/migration-smoke.sh

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - run: bash scripts/ci/compose-smoke.sh

  e2e-smoke:
    needs: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.22"
      - run: docker compose up -d
      - run: python scripts/wait_for_http.py http://127.0.0.1:8000/api/v1/health/live --timeout 120
      - run: docker compose exec -T api alembic upgrade head
      - run: python scripts/wait_for_http.py http://127.0.0.1:8000/api/v1/health/ready --timeout 120
      - run: cd frontend && bun install --frozen-lockfile && bunx playwright install --with-deps chromium && bunx playwright test -c playwright.compose.config.ts
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down -v --remove-orphans

  security-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.9.26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.22"
      - run: uv sync --frozen --all-groups
      - run: cd frontend && bun install --frozen-lockfile
      - run: bash scripts/ci/security-smoke.sh
