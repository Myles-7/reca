name: reca

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_APP_ENV: ${VITE_APP_ENV:-local}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks:
      - edge
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-RECA}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEMO_MODE: ${DEMO_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-50000000}
      CONNECT_TIMEOUT_SECONDS: ${CONNECT_TIMEOUT_SECONDS:-5}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-reca-local-only-secret-key-change-before-shared-use}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-reca-local-only-admin-password}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-reca}
      POSTGRES_USER: ${POSTGRES_USER:-reca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reca-local-only-postgres-password}
      VALKEY_URL: valkey://valkey:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reca-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reca-local-minio-password-change-before-shared-use}
      MINIO_BUCKET: ${MINIO_BUCKET:-reca}
      GROBID_URL: http://grobid:8070
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://valkey:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://valkey:6379/1}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      OPENALEX_API_URL: ${OPENALEX_API_URL:-https://api.openalex.org}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - edge
      - internal
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reca}
      POSTGRES_USER: ${POSTGRES_USER:-reca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reca-local-only-postgres-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    networks:
      - internal
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.7-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - valkey_data:/data
    networks:
      - internal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=INFO", "--pool=solo", "--concurrency=1", "--hostname=reca-worker@%h", "--pidfile=/tmp/reca/celery.pid", "--without-gossip", "--without-mingle"]
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-RECA}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:-reca-local-only-secret-key-change-before-shared-use}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-reca-local-only-admin-password}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-reca}
      POSTGRES_USER: ${POSTGRES_USER:-reca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reca-local-only-postgres-password}
      VALKEY_URL: valkey://valkey:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reca-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reca-local-minio-password-change-before-shared-use}
      GROBID_URL: http://grobid:8070
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://valkey:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://valkey:6379/1}
    read_only: true
    tmpfs:
      - /tmp/reca:rw,nosuid,nodev,size=64m
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reca-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reca-local-minio-password-change-before-shared-use}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - minio_data:/data
    networks:
      - internal
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.8.2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8070/api/isalive"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  valkey_data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
